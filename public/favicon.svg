<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="256" fill="#1a1a1a"/>
  <circle cx="256" cy="256" r="220" fill="#7ecbc0"/>
  <!-- × (multiply) top-left -->
  <g stroke="#1a1a1a" stroke-width="36" stroke-linecap="round">
    <line x1="120" y1="140" x2="200" y2="220"/>
    <line x1="200" y1="140" x2="120" y2="220"/>
  </g>
  <!-- + (plus) top-right -->
  <g stroke="#1a1a1a" stroke-width="36" stroke-linecap="round">
    <line x1="312" y1="180" x2="392" y2="180"/>
    <line x1="352" y1="140" x2="352" y2="220"/>
  </g>
  <!-- = (equals) bottom-left -->
  <g stroke="#1a1a1a" stroke-width="36" stroke-linecap="round">
    <line x1="120" y1="310" x2="210" y2="310"/>
    <line x1="120" y1="370" x2="210" y2="370"/>
  </g>
  <!-- − (minus) bottom-right -->
  <g stroke="#1a1a1a" stroke-width="36" stroke-linecap="round">
    <line x1="312" y1="340" x2="392" y2="340"/>
  </g>
</svg>
